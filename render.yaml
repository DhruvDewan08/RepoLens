services:
  - type: web
    name: repolens
    runtime: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: repolens-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: repolens-db
    plan: starter
    postgresMajorVersion: "16"
